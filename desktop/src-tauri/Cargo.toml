[package]
name = "doispapo"
version = "0.1.6"
description = "Dois Papo — plataforma de comunicação"
authors = ["kaueramone"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"
# usado para o adiamento da checagem de versão; o Tauri não reexporta
tokio = { version = "1", features = ["time"] }

[profile.release]
opt-level = "s"     # otimiza tamanho: é um invólucro, não há computação pesada
lto = true
codegen-units = 1
panic = "abort"
strip = true
