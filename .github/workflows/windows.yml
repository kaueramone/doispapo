# Compila o instalador do Dois Papo para Windows.
#
# Passos deliberadamente granulares: sem acesso de admin ao log, a API de
# jobs só informa QUAL passo falhou. Quanto menor cada passo, mais preciso
# fica o diagnóstico.
name: Instalador Windows

on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compilar:
    runs-on: windows-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache das dependências
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Conferir estrutura do projeto
        shell: pwsh
        working-directory: desktop
        run: |
          Get-ChildItem -Recurse -File | Select-Object FullName
          if (!(Test-Path src-tauri/tauri.conf.json)) { throw "tauri.conf.json ausente" }
          if (!(Test-Path frontend/index.html))       { throw "frontend ausente" }

      - name: Instalar a CLI do Tauri
        run: cargo install tauri-cli --version "^2.0" --locked

      - name: Verificar se o Rust compila
        working-directory: desktop/src-tauri
        run: cargo check --release

      - name: Empacotar o instalador
        working-directory: desktop
        run: cargo tauri build

      - name: Listar o que foi gerado
        if: always()
        shell: pwsh
        run: |
          $p = "desktop/src-tauri/target/release/bundle"
          if (Test-Path $p) { Get-ChildItem -Recurse $p | Select-Object FullName, Length }
          else { Write-Host "nenhum pacote gerado" }

      - name: Renomear para um nome estável
        shell: pwsh
        run: |
          $exe = Get-ChildItem desktop/src-tauri/target/release/bundle/nsis/*.exe |
                 Select-Object -First 1
          if (-not $exe) { throw "instalador não encontrado" }
          New-Item -ItemType Directory -Force -Path publicar | Out-Null
          # nome fixo: é o que permite um link permanente de download
          Copy-Item $exe.FullName publicar/DoisPapo-Setup.exe
          Write-Host "origem: $($exe.Name)  ->  DoisPapo-Setup.exe"
          "{0:N1} MB" -f ($exe.Length / 1MB)

      - name: Publicar como artefato
        uses: actions/upload-artifact@v4
        with:
          name: instalador-windows
          path: publicar/DoisPapo-Setup.exe
          if-no-files-found: error
          retention-days: 30

      # Só tags do aplicativo criam release, e o prefixo é conferido aqui de
      # propósito. O `verificar_atualizacao` do main.rs lê
      # `releases/latest`, que é a última release de QUALQUER tag do
      # repositório, e faz `trim_start_matches("desktop-v")` antes de
      # comparar. Uma release criada para uma tag da plataforma (v0.44.0)
      # entraria nessa comparação como "0.44.0" contra "0.1.7" e todo
      # aplicativo instalado passaria a anunciar uma atualização que não
      # existe -- para sempre, porque a versão da plataforma só sobe.
      # O gatilho de cima já é só `desktop-v*`; isto é o cinto além do
      # suspensório, para quando alguém acrescentar outro gatilho.
      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          files: publicar/DoisPapo-Setup.exe
          name: Dois Papo para Windows ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          body: |
            Instalador do Dois Papo para Windows.

            **Baixar sempre a última versão:**
            https://doispapo.com/baixar/windows

            Instala sem pedir permissão de administrador. Na primeira
            execução o Windows exibirá um aviso de aplicativo não
            reconhecido — o executável não é assinado.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
