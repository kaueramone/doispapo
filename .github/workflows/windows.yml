# Compila o instalador do Dois Papo para Windows.
#
# Não é possível gerar binário do Windows na VPS Linux, então a compilação
# roda aqui, num runner Windows do GitHub. Repositório público tem minutos
# gratuitos.
#
# Dispara ao publicar uma tag desktop-v* ou manualmente pela aba Actions.
name: Instalador Windows

on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compilar:
    runs-on: windows-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache das dependências
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Compilar e empacotar
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tauriScript: cargo tauri
          args: --verbose

      - name: Publicar os instaladores
        uses: actions/upload-artifact@v4
        with:
          name: instaladores-windows
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 30
